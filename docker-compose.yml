services:
  postgres:
    image: postgres:16-alpine
    container_name: sca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sca
      POSTGRES_PASSWORD: sca
      POSTGRES_DB: sca
    ports:
      - "5432:5432"
    volumes:
      - sca_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sca -d sca"]
      interval: 5s
      timeout: 5s
      retries: 10

